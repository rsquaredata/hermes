[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "hermes"
version = "0.1.0"
description = "Research framework for mobility evaluation and simulation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "rsquare" }
]

keywords = [
    "urban analytics",
    "mobility",
    "simulation",
    "energy",
    "machine learning",
    "geospatial analysis",
    "open data"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]